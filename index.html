<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BetIQ">
<title>BetIQ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root {
  --bg:#0a0d12;--surface:#111520;--surface2:#181e2e;--border:#1f2840;
  --accent:#00e5a0;--accent-dim:rgba(0,229,160,0.12);--accent-glow:rgba(0,229,160,0.25);
  --warn:#f59e0b;--danger:#ef4444;--text:#e8eaf0;--muted:#6b7a99;
  --live:#ef4444;--mono:'Space Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column;}

/* HEADER */
header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:rgba(10,13,18,0.95);backdrop-filter:blur(12px);z-index:50;}
.logo-dot{width:9px;height:9px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.6;transform:scale(.85);}}
.logo-text{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--accent);}
.logo-sub{font-size:11px;color:var(--muted);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .2s;}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent);}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:49px;z-index:40;}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab .live-dot{display:inline-block;width:6px;height:6px;background:var(--live);border-radius:50%;margin-right:5px;animation:pulse 1s ease-in-out infinite;}

/* MAIN */
main{flex:1;max-width:680px;width:100%;margin:0 auto;padding:16px 12px 80px;}

/* SPORT FILTER */
.sport-filter{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none;margin-bottom:4px;}
.sport-filter::-webkit-scrollbar{display:none;}
.sf-btn{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .18s;font-family:var(--sans);}
.sf-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600;}

/* LOADING */
.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* MATCH CARDS */
.section-label{font-size:11px;font-family:var(--mono);letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding:12px 4px 8px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.live-badge{background:var(--live);color:#fff;font-size:10px;padding:2px 7px;border-radius:10px;letter-spacing:.05em;animation:pulse 1.5s ease-in-out infinite;}

.match-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:8px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.match-card:hover{border-color:var(--accent);background:var(--surface2);}
.match-card.live{border-left:3px solid var(--live);}
.match-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 60%,rgba(0,229,160,0.03));pointer-events:none;}

.match-league{font-size:11px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.league-flag{font-size:14px;}

.match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.team{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;}
.team-name{font-size:14px;font-weight:600;line-height:1.2;}
.team.away .team-name{text-align:center;}
.score-box{text-align:center;}
.score{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);letter-spacing:.05em;}
.score.live-score{color:var(--live);}
.match-time{font-size:11px;color:var(--muted);text-align:center;}
.match-status{font-size:11px;font-family:var(--mono);}
.match-status.live{color:var(--live);}
.match-status.upcoming{color:var(--warn);}
.match-status.finished{color:var(--muted);}

.analyze-chip{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:all .18s;display:inline-block;}
.analyze-chip:hover{background:var(--accent);color:#0a0d12;}
.match-footer{display:flex;align-items:center;justify-content:flex-end;margin-top:6px;}

.date-group-header{font-size:12px;font-family:var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;padding:14px 4px 8px;display:flex;align-items:center;gap:8px;font-weight:700;}
.date-group-header::after{content:'';flex:1;height:1px;background:var(--border);}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-state .icon{font-size:40px;margin-bottom:12px;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
@media(min-width:600px){.modal-overlay{align-items:center;}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px;}
@media(min-width:600px){.modal{border-radius:20px;}}

.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
.modal-match{background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:16px;text-align:center;}
.modal-teams{font-size:18px;font-weight:700;margin-bottom:4px;}
.modal-meta{font-size:12px;color:var(--muted);}

.modal-section{margin-bottom:14px;}
.modal-label{font-size:11px;font-family:var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-bottom:7px;}
.modal-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-family:var(--sans);font-size:14px;outline:none;transition:border-color .2s;}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.modal-input::placeholder{color:var(--muted);}

.bet-chips{display:flex;gap:6px;flex-wrap:wrap;}
.bet-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:var(--muted);cursor:pointer;transition:all .18s;}
.bet-chip.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:600;}

.modal-btn{width:100%;padding:13px;background:var(--accent);color:#0a0d12;font-family:var(--sans);font-size:15px;font-weight:700;border:none;border-radius:10px;cursor:pointer;margin-top:4px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.modal-btn:hover:not(:disabled){background:#00ffb3;box-shadow:0 4px 20px var(--accent-glow);}
.modal-btn:disabled{opacity:.5;cursor:not-allowed;}
.modal-close{position:absolute;top:16px;right:16px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}

/* RESULT INSIDE MODAL */
.result-section{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
.verdict-row{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.verdict-icon{font-size:28px;}
.verdict-label{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:.06em;margin-bottom:3px;}
.verdict-text{font-size:16px;font-weight:700;color:var(--accent);}
.conf-right{margin-left:auto;text-align:right;}
.conf-bar-wrap{width:80px;height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:4px;}
.conf-bar{height:100%;background:var(--accent);border-radius:3px;transition:width 1s ease;width:0%;}
.conf-val{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);}

.factors-wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.factor-pill{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;display:flex;gap:7px;align-items:flex-start;}
.factor-pill .fi{font-size:14px;}
.factor-pill .fn{font-weight:600;font-size:11px;margin-bottom:1px;}
.factor-pill .fv{font-size:11px;color:var(--muted);}

.analysis-text{font-size:13px;line-height:1.8;color:var(--text);}
.analysis-text p{margin-bottom:10px;}

.modal-loading{text-align:center;padding:30px;color:var(--muted);font-size:14px;}

.disclaimer-sm{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:8px;padding:10px 12px;font-size:11px;color:#a07030;margin-top:12px;line-height:1.6;}

.error-msg{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:12px;color:#fca5a5;font-size:13px;margin-top:10px;}
</style>
</head>
<body>

<header>
  <div class="logo-dot"></div>
  <span class="logo-text">BetIQ</span>
  <span class="logo-sub">/ Live</span>
  <div class="header-right">
    <button class="refresh-btn" onclick="loadMatches()">↺ Obnovit</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-live" onclick="switchTab('live')">
    <span class="live-dot"></span>Živé zápasy
  </div>
  <div class="tab" id="tab-upcoming" onclick="switchTab('upcoming')">
    📅 Dnešní program
  </div>
  <div class="tab" id="tab-future" onclick="switchTab('future')">📅 Budoucí</div>
</div>

<main>
  <div class="sport-filter" id="sportFilter">
    <button class="sf-btn active" data-sport="all" onclick="filterSport(this)">🌍 Vše</button>
    <button class="sf-btn" data-sport="football" onclick="filterSport(this)">⚽ Fotbal</button>
  </div>

  <div id="matchList">
    <div class="loading">
      <div class="spinner"></div>
      <p>Načítám zápasy...</p>
    </div>
  </div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>

    <div class="modal-match">
      <div id="modalScoreSection" style="margin-bottom:8px;display:none;">
        <div style="font-family:var(--mono);font-size:36px;font-weight:700;color:var(--live);letter-spacing:.05em;" id="modalScoreBig">0:0</div>
        <div style="font-size:13px;color:var(--live);font-weight:600;margin-top:2px;" id="modalMinute"></div>
      </div>
      <div class="modal-teams" id="modalTeams">—</div>
      <div class="modal-meta" id="modalMeta">—</div>
    </div>

    <div class="modal-section">
      <div class="modal-label">Typ sázky</div>
      <div class="bet-chips" id="betChips">
        <div class="bet-chip active" onclick="selectChip(this,'Vítěz zápasu')">🏆 Vítěz</div>
        <div class="bet-chip" onclick="selectChip(this,'Obě týmy skórují')">⚽ Obě skórují</div>
        <div class="bet-chip" onclick="selectChip(this,'Over 2.5 gólů')">📊 Over 2.5</div>
        <div class="bet-chip" onclick="selectChip(this,'Under 2.5 gólů')">📊 Under 2.5</div>
        <div class="bet-chip" onclick="selectChip(this,'Asijský handicap')">🎯 Handicap</div>
        <div class="bet-chip" onclick="selectChip(this,'Vlastní...')">✏️ Vlastní</div>
      </div>
      <input type="text" class="modal-input" id="betCustom" placeholder="nebo napiš vlastní typ sázky..." style="margin-top:8px;display:none;">
    </div>

    <button class="modal-btn" id="analyzeBtn" onclick="runAnalysis()" style="font-size:16px;padding:15px;">
      ⚡ Udělat analýzu
    </button>

    <div id="analysisResult"></div>

    <div class="disclaimer-sm">
      ⚠️ Pouze pro vzdělávací účely. Sázení je hazardní hra.
    </div>
  </div>
</div>

<script>
let currentTab = 'live';
let currentSport = 'all';
let allMatches = [];
let selectedMatch = null;
let selectedBet = 'Vítěz zápasu';

// ── TAB SWITCH ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-live').classList.toggle('active', tab==='live');
  document.getElementById('tab-upcoming').classList.toggle('active', tab==='upcoming');
  document.getElementById('tab-future').classList.toggle('active', tab==='future');
  loadMatches();
}

// ── SPORT FILTER ─────────────────────────────────────────────────────────────
function filterSport(btn) {
  document.querySelectorAll('.sf-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSport = btn.dataset.sport;
  renderMatches();
}

// ── LOAD MATCHES ─────────────────────────────────────────────────────────────
async function loadMatches() {
  document.getElementById('matchList').innerHTML = `<div class="loading"><div class="spinner"></div><p>Načítám zápasy...</p></div>`;
  try {
    const res = await fetch(`/api/matches?type=${currentTab}`);
    const data = await res.json();
    allMatches = parseMatches(data);
    renderMatches();
  } catch(e) {
    document.getElementById('matchList').innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Nepodařilo se načíst zápasy.<br><small style="color:var(--muted)">${e.message}</small></p></div>`;
  }
}

// ── FUTURE MATCHES DATE HELPERS ───────────────────────────────────────────────
function formatDateHeader(dateStr) {
  if (!dateStr) return 'Neznámé datum';
  const date = new Date(dateStr);
  const today = new Date();
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  const d2 = new Date(today); d2.setDate(today.getDate() + 2);

  const dayNames = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
  const monthNames = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];

  const dateDay = date.toISOString().split('T')[0];
  const tomorrowDay = tomorrow.toISOString().split('T')[0];

  const dayPart = `${date.getDate()}. ${monthNames[date.getMonth()]}`;

  if (dateDay === tomorrowDay) return `Zítra · ${dayPart}`;
  const dayName = dayNames[date.getDay()];
  return `${dayName} · ${dayPart}`;
}

// ── PARSE API RESPONSE ────────────────────────────────────────────────────────
function parseMatches(data) {
  // Free API Live Football Data response format
  try {
    const matches = [];
    // Try different response shapes
    let items = data.response || data.data || data.matches || data.fixtures || data.livescores || [];

    if(!Array.isArray(items) || items.length === 0) {
      // Try nested
      const nested = data.response?.fixtures || data.response?.livescores || [];
      if(Array.isArray(nested)) items = nested;
    }

    (Array.isArray(items) ? items : []).forEach(item => {
      // Normalize different field names
      const home = item.home?.name || item.homeTeam?.name || item.home_team?.name || item.teams?.home?.name || 'Domácí';
      const away = item.away?.name || item.awayTeam?.name || item.away_team?.name || item.teams?.away?.name || 'Hosté';
      const homeScore = item.home?.score ?? item.score?.home ?? item.goals?.home ?? item.homeScore ?? '–';
      const awayScore = item.away?.score ?? item.score?.away ?? item.goals?.away ?? item.awayScore ?? '–';
      const league = item.league?.name || item.competition?.name || item.tournament?.name || item.leagueName || 'Fotbal';
      const country = item.league?.country || item.country?.name || '';
      const status = item.status?.short || item.status || item.statusShort || 'NS';
      const minute = item.status?.elapsed || item.elapsed || item.minute || null;
      const time = item.fixture?.date || item.date || item.datetime || '';
      const fetchDate = item._fetchDate || (time ? time.split('T')[0] : '');

      matches.push({ home, away, homeScore, awayScore, league, country, status, minute, time, fetchDate, raw: item });
    });

    return matches;
  } catch(e) {
    console.error('Parse error:', e);
    return [];
  }
}

// ── STATUS HELPERS ────────────────────────────────────────────────────────────
function isLive(s) { return ['1H','2H','HT','ET','P','LIVE','IN_PLAY','inprogress'].includes(s); }
function isFinished(s) { return ['FT','AET','PEN','FINISHED','finished'].includes(s); }
function formatTime(dateStr) {
  if(!dateStr) return '';
  try { return new Date(dateStr).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}); }
  catch(e) { return dateStr; }
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderMatches() {
  const list = document.getElementById('matchList');
  let matches = allMatches;

  if(matches.length === 0) {
    const icons = {live:'📡', upcoming:'📅', future:'📅'};
    const msgs = {live:'Žádné živé zápasy právě teď.', upcoming:'Žádné zápasy dnes.', future:'Žádné budoucí zápasy k zobrazení.'};
    list.innerHTML = `<div class="empty-state"><div class="icon">${icons[currentTab]||'📅'}</div><p>${msgs[currentTab]||'Žádné zápasy.'}</p></div>`;
    return;
  }

  const live = matches.filter(m => isLive(m.status));
  const upcoming = matches.filter(m => !isLive(m.status) && !isFinished(m.status));
  const finished = matches.filter(m => isFinished(m.status));

  let html = '';

  if(currentTab === 'live') {
    if(live.length) {
      html += `<div class="section-label"><span class="live-badge">ŽIVĚ</span> ${live.length} zápasů</div>`;
      html += live.map((m,i) => matchCard(m, i, true)).join('');
    }
    if(finished.length) {
      html += `<div class="section-label">Ukončené</div>`;
      html += finished.map((m,i) => matchCard(m, i+live.length, false)).join('');
    }
    if(!live.length && !finished.length) {
      html = `<div class="empty-state"><div class="icon">📡</div><p>Žádné živé zápasy právě teď.<br><small style="color:var(--muted)">Zkus přepnout na Dnešní program</small></p></div>`;
    }
  } else if(currentTab === 'future') {
    // Seskup podle data
    const byDate = {};
    matches.forEach((m, i) => {
      const key = m.fetchDate || (m.time ? m.time.split('T')[0] : 'unknown');
      if (!byDate[key]) byDate[key] = [];
      byDate[key].push({ m, i });
    });
    const sortedDates = Object.keys(byDate).sort();
    sortedDates.forEach(dateKey => {
      html += `<div class="date-group-header">${formatDateHeader(dateKey)}</div>`;
      byDate[dateKey].forEach(({ m, i }) => {
        html += matchCard(m, i, isLive(m.status));
      });
    });
  } else {
    if(upcoming.length) {
      html += `<div class="section-label">Nadcházející</div>`;
      html += upcoming.map((m,i) => matchCard(m, i, false)).join('');
    }
    if(live.length) {
      html += `<div class="section-label"><span class="live-badge">ŽIVĚ</span></div>`;
      html += live.map((m,i) => matchCard(m, i+upcoming.length, true)).join('');
    }
    if(finished.length) {
      html += `<div class="section-label">Ukončené</div>`;
      html += finished.map((m,i) => matchCard(m, i+upcoming.length+live.length, false)).join('');
    }
  }

  list.innerHTML = html;
}

function matchCard(m, idx, live) {
  const scoreDisplay = (m.homeScore !== undefined && m.homeScore !== '–')
    ? `<div class="score ${live?'live-score':''}">${m.homeScore}:${m.awayScore}</div>`
    : `<div class="score" style="color:var(--muted);font-size:16px;">vs</div>`;

  let statusText = '';
  if(live) statusText = `<div class="match-status live">${m.minute ? m.minute+"'" : 'ŽIVĚ'}</div>`;
  else if(isFinished(m.status)) statusText = `<div class="match-status finished">Konec</div>`;
  else statusText = `<div class="match-status upcoming">${formatTime(m.time) || 'Dnes'}</div>`;

  return `<div class="match-card ${live?'live':''}" onclick="openModal(${idx})">
    <div class="match-league"><span class="league-flag">⚽</span>${m.league}${m.country?' · '+m.country:''}</div>
    <div class="match-teams">
      <div class="team"><div class="team-name">${m.home}</div></div>
      <div class="score-box">${scoreDisplay}${statusText}</div>
      <div class="team away"><div class="team-name">${m.away}</div></div>
    </div>
    <div class="match-footer">
      <div class="analyze-chip" onclick="event.stopPropagation();openModal(${idx},true)">⚡ Analyzovat</div>
    </div>
  </div>`;
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(idx, autoAnalyze = false) {
  selectedMatch = allMatches[idx];
  const liveMatch = isLive(selectedMatch.status);

  document.getElementById('modalTeams').textContent = `${selectedMatch.home} vs ${selectedMatch.away}`;
  document.getElementById('modalMeta').textContent = `${selectedMatch.league} · ${liveMatch ? '🔴 ŽIVĚ ' + (selectedMatch.minute ? selectedMatch.minute+"'" : '') : formatTime(selectedMatch.time) || 'Dnes'}`;

  // Sekce se skóre pro živé zápasy
  const scoreSection = document.getElementById('modalScoreSection');
  if (liveMatch && selectedMatch.homeScore !== '–') {
    document.getElementById('modalScoreBig').textContent = `${selectedMatch.homeScore}:${selectedMatch.awayScore}`;
    document.getElementById('modalMinute').textContent = selectedMatch.minute ? `${selectedMatch.minute}' · ŽIVĚ` : 'ŽIVĚ';
    scoreSection.style.display = 'block';
  } else {
    scoreSection.style.display = 'none';
  }

  document.getElementById('analysisResult').innerHTML = '';
  document.getElementById('analyzeBtn').disabled = false;
  // Reset chips
  document.querySelectorAll('.bet-chip').forEach(c=>c.classList.remove('active'));
  document.querySelector('.bet-chip').classList.add('active');
  selectedBet = 'Vítěz zápasu';
  document.getElementById('betCustom').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  if (autoAnalyze) {
    setTimeout(() => runAnalysis(), 150);
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if(e.target === document.getElementById('modalOverlay')) closeModal();
}

function selectChip(chip, bet) {
  document.querySelectorAll('.bet-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  selectedBet = bet;
  document.getElementById('betCustom').style.display = bet === 'Vlastní...' ? 'block' : 'none';
}

// ── ANALYSIS ──────────────────────────────────────────────────────────────────
async function runAnalysis() {
  if(!selectedMatch) return;
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  const betType = selectedBet === 'Vlastní...'
    ? document.getElementById('betCustom').value.trim() || 'Vítěz zápasu'
    : selectedBet;

  document.getElementById('analysisResult').innerHTML = `<div class="modal-loading"><div class="spinner" style="margin:0 auto 12px;width:28px;height:28px;border-width:2px"></div>AI analyzuje zápas a hledá aktuální informace...</div>`;

  const today = new Date().toLocaleDateString('cs-CZ');
  const isLiveMatch = isLive(selectedMatch.status);
  const scoreInfo = isLiveMatch ? `Aktuální skóre: ${selectedMatch.homeScore}:${selectedMatch.awayScore} (${selectedMatch.minute ? selectedMatch.minute+"'" : 'ŽIVĚ'})` : '';

  const systemPrompt = `Jsi expertni sportovni analytik. Pouzivej web search pro aktualni informace.
Vrat POUZE validni JSON (bez markdown):
{"verdict":"doporuceni max 55 znaku","confidence":72,"verdictIcon":"🎯","factors":[{"icon":"🩺","name":"Zraneni","value":"popis","type":"negative"}],"analysis":"analyza odstavce oddelene /par/","risks":[{"label":"Nejistota","value":45,"color":"#f59e0b"}],"sources":["zdroj 1"]}
PRAVIDLA: zadne uvozovky uvnitr stringu, factors max 5, risks max 3, sources max 3, confidence 0-100. Datum: ${today}.`;

  const userMsg = `Analyzuj: ${selectedMatch.home} vs ${selectedMatch.away}
Liga: ${selectedMatch.league}
${scoreInfo}
Typ sazky: ${betType}
${isLiveMatch ? 'Zapas PRAVE PROBIHA - zohledni aktualni vyvoj.' : ''}
Vrat JSON analyzu.`;

  try {
    const res = await fetch('/api/analyze', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: systemPrompt,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:userMsg}]
      })
    });

    const data = await res.json();
    if(data.error) throw new Error(data.error.message);

    const fullText = data.content.map(b=>b.type==='text'?b.text:'').filter(Boolean).join('\n');
    let clean = fullText.replace(/```json|```/g,'').trim();
    const obj = clean.match(/\{[\s\S]*\}/);
    if(!obj) throw new Error('Neplatná odpověď AI');
    clean = obj[0].replace(/,(\s*[}\]])/g,'$1');
    const r = JSON.parse(clean);
    renderAnalysis(r);
  } catch(e) {
    document.getElementById('analysisResult').innerHTML = `<div class="error-msg">Chyba: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderAnalysis(r) {
  const conf = Math.min(100,Math.max(0,r.confidence||50));
  const colors = {positive:'#00e5a0',negative:'#ef4444',neutral:'#6b7a99'};

  const factors = (r.factors||[]).map(f=>`
    <div class="factor-pill">
      <span class="fi">${f.icon||'•'}</span>
      <div><div class="fn" style="color:${colors[f.type]||colors.neutral}">${f.name}</div><div class="fv">${f.value}</div></div>
    </div>`).join('');

  const parts = (r.analysis||'').split('/par/').map(p=>p.trim()).filter(Boolean);
  const analysisHtml = parts.map(p=>`<p>${p}</p>`).join('');

  document.getElementById('analysisResult').innerHTML = `
    <div class="result-section">
      <div class="verdict-row">
        <div class="verdict-icon">${r.verdictIcon||'🎯'}</div>
        <div>
          <div class="verdict-label">DOPORUČENÍ</div>
          <div class="verdict-text">${r.verdict||'—'}</div>
        </div>
        <div class="conf-right">
          <div class="conf-bar-wrap"><div class="conf-bar" id="cbar" style="width:0%"></div></div>
          <div class="conf-val">${conf}%</div>
        </div>
      </div>
      <div class="factors-wrap">${factors}</div>
      <div class="analysis-text">${analysisHtml}</div>
    </div>`;

  setTimeout(()=>{ const b=document.getElementById('cbar'); if(b) b.style.width=conf+'%'; },100);
  document.getElementById('modal').scrollTo({top:999,behavior:'smooth'});
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadMatches();
setInterval(()=>{ if(currentTab==='live') loadMatches(); }, 60000);
setInterval(()=>{ if(currentTab==='future') loadMatches(); }, 300000);
</script>
